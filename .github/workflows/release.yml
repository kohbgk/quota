name: Release

# Push a tag like v0.1.0 (matching the version in src-tauri/tauri.conf.json)
# to build Quota on Windows and publish an installer and a portable .exe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match app version v$version"
            exit 1
          }
          if (-not ((Get-Content CHANGELOG.md) -contains "## [$version]")) {
            Write-Error "CHANGELOG.md has no '## [$version]' section for the release notes"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build installer
        run: npx tauri build

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "out/Quota_${version}_x64-setup.exe"
          Copy-Item src-tauri/target/release/quota.exe "out/Quota_${version}_x64-portable.exe"
          Get-ChildItem out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content out/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are this version's section of CHANGELOG.md.
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## [$version]")
          if ($start -lt 0) { Write-Error "CHANGELOG.md has no '## [$version]' section"; exit 1 }
          $section = $lines[($start + 1)..($lines.Length - 1)]
          $next = 0
          while ($next -lt $section.Length -and -not $section[$next].StartsWith("## ")) { $next++ }
          $section[0..($next - 1)] | Set-Content release-notes.md
          gh release create "${{ github.ref_name }}" out/* --title "Quota ${{ github.ref_name }}" --notes-file release-notes.md
